server:
  port: 8082

spring:
  application:
    name: task-service
  datasource:
    url: jdbc:postgresql://localhost:5432/taskflow_tasks
    username: postgres
    password: postgres123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

resilience4j:
  circuitbreaker:
    instances:
      workflow-service:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true
        event-consumer-buffer-size: 10
      auth-service:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true
        event-consumer-buffer-size: 10
  retry:
    instances:
      workflow-service:
        max-attempts: 3
        wait-duration: 1s
      auth-service:
        max-attempts: 2
        wait-duration: 1s

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, resilience4j.circuitbreaker.events
  endpoint:
    health:
      show-details: always

auth:
  service:
    url: http://localhost:8081

workflow:
  id:
    default: 6
  service:
    url: http://localhost:8083

logging:
  level:
    com.example.task: DEBUG
